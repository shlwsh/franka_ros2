<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franka API 控制面板</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>Franka API</h2>
                <div id="connection-status" class="status-indicator offline" title="离线"></div>
            </div>
            
            <ul class="nav-menu">
                <li><a href="#dashboard" class="nav-link active" data-target="dashboard-view"><i data-lucide="layout-dashboard"></i> 仪表盘</a></li>
                <li><a href="#motion" class="nav-link" data-target="motion-view"><i data-lucide="move"></i> 运动控制</a></li>
                <li><a href="#gripper" class="nav-link" data-target="gripper-view"><i data-lucide="grab"></i> 夹爪控制</a></li>
                <li><a href="#controllers" class="nav-link" data-target="controllers-view"><i data-lucide="cpu"></i> 控制器管理</a></li>
                <li><a href="#config" class="nav-link" data-target="config-view"><i data-lucide="settings"></i> 系统配置</a></li>
                <li><a href="#api-tester" class="nav-link" data-target="api-tester-view"><i data-lucide="terminal"></i> API 测试</a></li>
            </ul>
            
            <div class="sidebar-footer">
                <div class="auth-box">
                    <label>API 密钥</label>
                    <input type="password" id="api-key-input" value="franka-api-default-key">
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Dashboard View -->
            <section id="dashboard-view" class="view active">
                <header class="view-header">
                    <h1>仪表盘总览</h1>
                    <div class="robot-status-badge mode-idle" id="robot-mode-badge">未知</div>
                </header>
                
                <div class="grid dashboard-grid">
                    <div class="card col-span-2">
                        <h3>关节状态</h3>
                        <div class="joints-container" id="joints-display">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>末端执行器位姿</h3>
                        <div class="pose-display" id="pose-display">
                            等待数据...
                        </div>
                    </div>
                </div>
            </section>

            <!-- Motion Control View -->
            <section id="motion-view" class="view">
                <header class="view-header">
                    <h1>运动控制</h1>
                </header>
                
                <div class="grid">
                    <div class="card col-span-2">
                        <h3>关节空间控制 (PTP)</h3>
                        <div class="sliders-container" id="joint-sliders">
                            <!-- Populated by JS -->
                        </div>
                        
                        <div class="motion-controls">
                            <label>速度缩放比例: <span id="vel-scale-val">0.5</span></label>
                            <input type="range" id="vel-scale" min="0" max="1" step="0.01" value="0.5">
                            
                            <div class="btn-group">
                                <button class="btn btn-primary" id="btn-move-ptp">执行 PTP 运动</button>
                                <button class="btn btn-danger" id="btn-stop">紧急停止</button>
                                <button class="btn btn-warning" id="btn-recover">错误恢复</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>运动状态日志</h3>
                        <div id="motion-log" class="log-console">
                            就绪。
                        </div>
                    </div>
                </div>
            </section>

            <!-- Gripper Control View -->
            <section id="gripper-view" class="view">
                <header class="view-header">
                    <h1>夹爪控制</h1>
                </header>
                
                <div class="grid">
                    <div class="card">
                        <h3>当前状态</h3>
                        <div class="gripper-visual">
                            <div class="gripper-bar-container">
                                <div class="gripper-bar" id="gripper-width-bar"></div>
                            </div>
                            <div class="gripper-val"><span id="gripper-width-val">0.000</span> m</div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>抓取物体 (Grasp)</h3>
                        <div class="form-group">
                            <label>宽度 [m]</label>
                            <input type="number" id="grasp-width" value="0.04" step="0.001">
                        </div>
                        <div class="form-group">
                            <label>速度 [m/s]</label>
                            <input type="number" id="grasp-speed" value="0.1" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>抓取力 [N]</label>
                            <input type="number" id="grasp-force" value="50" step="1">
                        </div>
                        <button class="btn btn-primary w-full" id="btn-grasp">执行抓取</button>
                    </div>
                    
                    <div class="card">
                        <h3>移动 / 回零</h3>
                        <div class="form-group">
                            <label>目标宽度 [m]</label>
                            <input type="number" id="move-width" value="0.08" step="0.001">
                        </div>
                        <div class="form-group">
                            <label>速度 [m/s]</label>
                            <input type="number" id="move-speed" value="0.1" step="0.01">
                        </div>
                        <button class="btn btn-secondary w-full" id="btn-move-gripper">移动夹爪</button>
                        <hr class="my-4">
                        <button class="btn btn-warning w-full" id="btn-homing">回零初始化 (Homing)</button>
                    </div>
                </div>
            </section>

            <!-- Controllers View -->
            <section id="controllers-view" class="view">
                <header class="view-header">
                    <h1>控制器管理</h1>
                </header>
                <div class="card">
                    <table class="data-table" id="controllers-table">
                        <thead>
                            <tr>
                                <th>控制器名称</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                    <button class="btn btn-secondary mt-4" id="btn-refresh-ctrl">刷新列表</button>
                </div>
            </section>

            <!-- Config View -->
            <section id="config-view" class="view">
                <header class="view-header">
                    <h1>系统配置</h1>
                </header>
                <div class="card">
                    <p>设置项将在此处显示。</p>
                </div>
            </section>

            <!-- API Tester View -->
            <section id="api-tester-view" class="view">
                <header class="view-header">
                    <h1>API 测试工具</h1>
                </header>
                <div class="grid">
                    <div class="card col-span-2">
                        <div class="request-builder">
                            <select id="api-method">
                                <option>GET</option>
                                <option>POST</option>
                            </select>
                            <input type="text" id="api-path" value="/api/v1/status/joints">
                            <button class="btn btn-primary" id="btn-send-api">发送请求</button>
                        </div>
                        <textarea id="api-body" placeholder="JSON 请求体..."></textarea>
                    </div>
                    <div class="card col-span-2">
                        <h3>响应结果</h3>
                        <pre id="api-response" class="log-console json-response"></pre>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
