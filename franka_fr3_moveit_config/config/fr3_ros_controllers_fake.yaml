# 用于 fake hardware 模式的控制器配置
# 与 fr3_ros_controllers.yaml 的区别：command_interfaces 使用 position 而非 effort
# 原因：mock_components/GenericSystem 的 effort 接口不会转换为位置变化

/**: 
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

/**: 
  fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
