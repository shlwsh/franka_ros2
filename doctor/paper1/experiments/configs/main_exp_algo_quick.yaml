# Quick ablation: B2 vs algorithm enhancements (~1–3 min)
seeds: [0]
baselines: [B2, B2d, B2m, B2u]
n_frames_per_baseline: 60
retry_budget_K: 2

latency:
  capture_ms: 5.0
  edge_iqa_ms_mean: 9.0
  edge_iqa_ms_std: 2.0
  route_ms: 1.5
  resample_ms_lognormal_mu: 3.9
  resample_ms_lognormal_sigma: 0.25
  cloud_upload_ms_min: 50
  cloud_upload_ms_max: 550
  packet_loss_max: 0.15

algo_enhance_config: experiments/configs/algo_enhance.yaml

b3_checkpoint: experiments/results/b3_mobilenet.pt
b3_use_learned: false
