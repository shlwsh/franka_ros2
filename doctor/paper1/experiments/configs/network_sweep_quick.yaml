# Network perturbation sweep — quick mode (~2–4 min)
# Full grid: network_sweep.yaml

seeds: [0]
baselines: [B2, B2d]
n_frames_per_baseline: 40
retry_budget_K: 2

# Grid (Paper I 改进方案 §2.1)
cloud_rtt_ms_grid: [50, 150, 300, 500]
packet_loss_grid: [0.0, 0.05, 0.10, 0.20]

latency:
  capture_ms: 5.0
  edge_iqa_ms_mean: 9.0
  edge_iqa_ms_std: 2.0
  route_ms: 1.5
  resample_ms_lognormal_mu: 3.9
  resample_ms_lognormal_sigma: 0.25
  cloud_upload_ms_min: 50
  cloud_upload_ms_max: 550

algo_enhance_config: experiments/configs/algo_enhance.yaml

b3_use_learned: false
