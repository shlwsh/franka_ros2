# Quick smoke validation (Paper I Phase A) — ~2–5 min on CPU
# Full run: main_exp.yaml + paper1_run_tcm_full.sh

seeds: [0]
baselines: [B0, B1, B2, B3, B3t, B4]
n_frames_per_baseline: 80
retry_budget_K: 2

latency:
  capture_ms: 5.0
  edge_iqa_ms_mean: 9.0
  edge_iqa_ms_std: 2.0
  route_ms: 1.5
  resample_ms_lognormal_mu: 3.9
  resample_ms_lognormal_sigma: 0.25
  cloud_upload_ms_min: 50
  cloud_upload_ms_max: 550

b3_checkpoint: experiments/results/b3_mobilenet.pt
b3_use_learned: true

b0_bad_upload_penalty_min: 120
b0_bad_upload_penalty_max: 220

# Calibration companion (calibrate_tau_*.py --max-val)
quick_max_val: 120
